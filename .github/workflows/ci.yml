name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet.yml@main
    with:
      images: '[{"name": "swiftbets-compliance", "dockerfile": "deploy/SwiftBets.Compliance.Api.Dockerfile"}, {"name": "swiftbets-compliance-migrator", "dockerfile": "deploy/SwiftBets.Compliance.Migrator.Dockerfile"}]'
      coverage: true
      coverage-floors: '{"SwiftBets.Compliance.Domain": {"branch": 85}, "SwiftBets.Compliance.Application": {"branch": 65}}'
    permissions:
      contents: read
      packages: write
      security-events: write
